spring:
  application:
    name: finviet-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-very-long-default-secret-for-dev-only-12345}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  ai:
    provider: ${AI_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      categorize-model: ${OPENAI_CATEGORIZE_MODEL:gpt-4o-mini}
      report-model: ${OPENAI_REPORT_MODEL:gpt-4o}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o}
      timeout-seconds: 30
    fallback-enabled: true
  reports:
    weekly-cron: "0 0 8 * * MON"
  budget:
    alert-threshold-percent: 80

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:finviet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finviet}
    username: ${DATABASE_USER:finviet}
    password: ${DATABASE_PASSWORD:finviet}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
