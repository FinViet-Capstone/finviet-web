components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string, example: w001 }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, example: t001 }
    Month:
      name: month
      in: query
      required: true
      schema: { type: integer, example: 5 }
    Year:
      name: year
      in: query
      required: true
      schema: { type: integer, example: 2026 }
  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password, monthlyIncome]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        monthlyIncome: { type: number }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string }
        monthlyIncome: { type: number }
    CreateWalletRequest:
      type: object
      required: [walletName, walletType, initialBalance]
      properties:
        walletName: { type: string }
        walletType: { type: string, enum: [Cash, EWallet, BankAccount] }
        initialBalance: { type: number }
    UpdateWalletRequest:
      type: object
      properties:
        walletName: { type: string }
        walletType: { type: string, enum: [Cash, EWallet, BankAccount] }
    TransferWalletRequest:
      type: object
      required: [fromWalletId, toWalletId, amount]
      properties:
        fromWalletId: { type: string }
        toWalletId: { type: string }
        amount: { type: number }
        description: { type: string }
    CreateTransactionRequest:
      type: object
      required: [walletId, amount, type, description, transactionDate]
      properties:
        walletId: { type: string }
        amount: { type: number }
        type: { type: string, enum: [Income, Expense] }
        description: { type: string }
        transactionDate: { type: string, format: date-time }
    UpdateTransactionRequest:
      type: object
      properties:
        walletId: { type: string }
        categoryId: { type: string }
        amount: { type: number }
        description: { type: string }
        transactionDate: { type: string, format: date-time }
    CorrectCategoryRequest:
      type: object
      required: [correctedCategoryId]
      properties:
        correctedCategoryId: { type: string }
        note: { type: string }
    ParseSmsRequest:
      type: object
      required: [walletId, smsText]
      properties:
        walletId: { type: string }
        smsText: { type: string }
    ConfirmSmsRequest:
      type: object
      required: [walletId, amount, type, merchant, transactionDate, description, categoryId]
      properties:
        walletId: { type: string }
        amount: { type: number }
        type: { type: string, enum: [Income, Expense] }
        merchant: { type: string }
        transactionDate: { type: string, format: date-time }
        description: { type: string }
        categoryId: { type: string }
    CategorizeTransactionRequest:
      type: object
      required: [description, amount, type]
      properties:
        description: { type: string }
        amount: { type: number }
        type: { type: string, enum: [Income, Expense] }
    SpendingScoreRequest:
      type: object
      required: [fromDate, toDate]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
    CreateBudgetRequest:
      type: object
      required: [categoryId, month, year, limitAmount]
      properties:
        categoryId: { type: string }
        month: { type: integer }
        year: { type: integer }
        limitAmount: { type: number }
    UpdateBudgetRequest:
      type: object
      required: [limitAmount]
      properties:
        limitAmount: { type: number }
    GenerateWeeklyReportRequest:
      type: object
      required: [weekStartDate, weekEndDate]
      properties:
        weekStartDate: { type: string, format: date }
        weekEndDate: { type: string, format: date }
    ChatbotAskRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
    CreateSavingGoalRequest:
      type: object
      required: [goalName, targetAmount, deadline]
      properties:
        goalName: { type: string }
        targetAmount: { type: number }
        deadline: { type: string, format: date }
    UpdateSavingGoalProgressRequest:
      type: object
      required: [additionalAmount]
      properties:
        additionalAmount: { type: number }
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AnnouncementRequest:
      type: object
      required: [title, message, targetSegment]
      properties:
        title: { type: string }
        message: { type: string }
        targetSegment: { type: string }
