openapi: 3.0.3
info:
  title: FinViet API - Mock Data
  description: OpenAPI specification for FinViet AI-Powered Personal Finance Tracker mock APIs.
  version: 1.0.0
servers:
  - url: https://api.finviet.example.com
    description: Mock API Server
tags:
  - name: Auth
  - name: Users
  - name: Wallets
  - name: Categories
  - name: Transactions
  - name: Imports
  - name: AI
  - name: Budgets
  - name: Dashboard
  - name: Reports
  - name: Chatbot
  - name: Saving Goals
  - name: Notifications
  - name: Admin
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyen Van A
              email: vana@gmail.com
              password: Password@123
              monthlyIncome: 8000000
      responses:
        '200':
          description: Register successfully
          content:
            application/json:
              example:
                success: true
                message: Register successfully
                data:
                  userId: u001
                  fullName: Nguyen Van A
                  email: vana@gmail.com
                  monthlyIncome: 8000000
                  status: Active
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: vana@gmail.com
              password: Password@123
      responses:
        '200':
          description: Login successfully
          content:
            application/json:
              example:
                success: true
                message: Login successfully
                data:
                  accessToken: mock_access_token
                  refreshToken: mock_refresh_token
                  expiresIn: 3600
                  user:
                    userId: u001
                    fullName: Nguyen Van A
                    email: vana@gmail.com
  /api/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: mock_refresh_token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: new_mock_access_token
                  refreshToken: new_mock_refresh_token
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              example:
                success: true
                data:
                  userId: u001
                  fullName: Nguyen Van A
                  email: vana@gmail.com
                  monthlyIncome: 8000000
                  createdAt: '2026-05-04T10:00:00'
                  status: Active
    put:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              fullName: Nguyen Van A Updated
              monthlyIncome: 10000000
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              example:
                success: true
                message: Profile updated successfully
  /api/wallets:
    get:
      tags: [Wallets]
      summary: Get wallet list
      responses:
        '200':
          description: Wallet list
          content:
            application/json:
              example:
                success: true
                data:
                  - walletId: w001
                    walletName: Cash
                    walletType: Cash
                    balance: 1500000
                    createdAt: '2026-05-04T10:00:00'
                  - walletId: w002
                    walletName: MoMo
                    walletType: EWallet
                    balance: 2300000
                    createdAt: '2026-05-04T10:10:00'
                  - walletId: w003
                    walletName: Vietcombank
                    walletType: BankAccount
                    balance: 5200000
                    createdAt: '2026-05-04T10:20:00'
    post:
      tags: [Wallets]
      summary: Create wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
            example:
              walletName: BIDV
              walletType: BankAccount
              initialBalance: 3000000
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              example:
                success: true
                message: Wallet created successfully
                data:
                  walletId: w004
                  walletName: BIDV
                  walletType: BankAccount
                  balance: 3000000
  /api/wallets/{walletId}:
    put:
      tags: [Wallets]
      summary: Update wallet
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWalletRequest'
            example:
              walletName: Main Vietcombank
              walletType: BankAccount
      responses:
        '200':
          description: Wallet updated
          content:
            application/json:
              example:
                success: true
                message: Wallet updated successfully
    delete:
      tags: [Wallets]
      summary: Delete wallet
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet deleted
          content:
            application/json:
              example:
                success: true
                message: Wallet deleted successfully
  /api/wallets/transfer:
    post:
      tags: [Wallets]
      summary: Transfer between wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferWalletRequest'
            example:
              fromWalletId: w001
              toWalletId: w002
              amount: 500000
              description: Transfer cash to MoMo
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              example:
                success: true
                message: Transfer completed successfully
                data:
                  fromWalletBalance: 1000000
                  toWalletBalance: 2800000
  /api/categories:
    get:
      tags: [Categories]
      summary: Get categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              example:
                success: true
                data:
                  - categoryId: c001
                    categoryName: Food
                    categoryType: Expense
                    icon: restaurant
                    color: '#FF9800'
                  - categoryId: c002
                    categoryName: Transport
                    categoryType: Expense
                    icon: directions_car
                    color: '#2196F3'
                  - categoryId: c003
                    categoryName: Entertainment
                    categoryType: Expense
                    icon: sports_esports
                    color: '#9C27B0'
                  - categoryId: c004
                    categoryName: Education
                    categoryType: Expense
                    icon: school
                    color: '#3F51B5'
                  - categoryId: c005
                    categoryName: Income
                    categoryType: Income
                    icon: payments
                    color: '#4CAF50'
  /api/transactions:
    get:
      tags: [Transactions]
      summary: Get transaction list
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date, example: '2026-05-01' }
        - name: toDate
          in: query
          schema: { type: string, format: date, example: '2026-05-31' }
        - name: walletId
          in: query
          schema: { type: string, example: w001 }
        - name: categoryId
          in: query
          schema: { type: string, example: c001 }
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              example:
                success: true
                data:
                  - transactionId: t001
                    walletId: w002
                    walletName: MoMo
                    categoryId: c001
                    categoryName: Food
                    amount: 45000
                    type: Expense
                    description: An sang Q2 voi ban
                    merchant: Unknown
                    transactionDate: '2026-05-10T08:15:00'
                    sourceType: Manual
                    aiConfidence: 0.91
                  - transactionId: t002
                    walletId: w003
                    walletName: Vietcombank
                    categoryId: c002
                    categoryName: Transport
                    amount: 72000
                    type: Expense
                    description: Grab 4.7km
                    merchant: Grab
                    transactionDate: '2026-05-11T18:30:00'
                    sourceType: SMS
                    aiConfidence: 0.95
    post:
      tags: [Transactions]
      summary: Create manual transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              walletId: w002
              amount: 45000
              type: Expense
              description: An sang Q2 voi ban
              transactionDate: '2026-05-10T08:15:00'
      responses:
        '200':
          description: Transaction created
          content:
            application/json:
              example:
                success: true
                message: Transaction created successfully
                data:
                  transactionId: t001
                  suggestedCategory:
                    categoryId: c001
                    categoryName: Food
                  aiConfidence: 0.91
  /api/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction detail
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              example:
                success: true
                data:
                  transactionId: t001
                  walletId: w002
                  walletName: MoMo
                  categoryId: c001
                  categoryName: Food
                  amount: 45000
                  type: Expense
                  description: An sang Q2 voi ban
                  merchant: Unknown
                  transactionDate: '2026-05-10T08:15:00'
                  sourceType: Manual
                  aiConfidence: 0.91
                  createdAt: '2026-05-10T08:16:00'
    put:
      tags: [Transactions]
      summary: Update transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
            example:
              walletId: w002
              categoryId: c001
              amount: 50000
              description: An sang voi ban o quan Q2
              transactionDate: '2026-05-10T08:15:00'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              example:
                success: true
                message: Transaction updated successfully
    delete:
      tags: [Transactions]
      summary: Delete transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              example:
                success: true
                message: Transaction deleted successfully
  /api/transactions/{transactionId}/correct-category:
    put:
      tags: [Transactions]
      summary: Correct transaction category
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectCategoryRequest'
            example:
              correctedCategoryId: c003
              note: This was a gaming top-up, not food
      responses:
        '200':
          description: Category corrected
          content:
            application/json:
              example:
                success: true
                message: Category corrected successfully
                data:
                  transactionId: t003
                  originalCategory: Food
                  correctedCategory: Entertainment
                  correctedAt: '2026-05-12T14:20:00'
  /api/transactions/import/csv:
    post:
      tags: [Imports]
      summary: Import transactions from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bankType, walletId]
              properties:
                file:
                  type: string
                  format: binary
                bankType:
                  type: string
                  example: Vietcombank
                walletId:
                  type: string
                  example: w003
      responses:
        '200':
          description: CSV import started
          content:
            application/json:
              example:
                success: true
                message: CSV import started
                data:
                  batchId: b001
                  bankType: Vietcombank
                  totalRows: 120
                  status: Processing
  /api/transactions/import/batches/{batchId}:
    get:
      tags: [Imports]
      summary: Get import batch result
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, example: b001 }
      responses:
        '200':
          description: Import batch result
          content:
            application/json:
              example:
                success: true
                data:
                  batchId: b001
                  bankType: Vietcombank
                  totalRows: 120
                  successRows: 115
                  failedRows: 5
                  status: Completed
                  createdAt: '2026-05-12T09:00:00'
  /api/transactions/import/sms/parse:
    post:
      tags: [Imports]
      summary: Parse SMS transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseSmsRequest'
            example:
              walletId: w003
              smsText: 'TK 123456 GD: -72,000VND tai Grab. So du: 5,200,000VND. 11/05/2026 18:30'
      responses:
        '200':
          description: SMS parsed
          content:
            application/json:
              example:
                success: true
                data:
                  amount: 72000
                  type: Expense
                  merchant: Grab
                  transactionDate: '2026-05-11T18:30:00'
                  description: Grab
                  suggestedCategory:
                    categoryId: c002
                    categoryName: Transport
                  aiConfidence: 0.95
  /api/transactions/import/sms/confirm:
    post:
      tags: [Imports]
      summary: Confirm SMS transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSmsRequest'
            example:
              walletId: w003
              amount: 72000
              type: Expense
              merchant: Grab
              transactionDate: '2026-05-11T18:30:00'
              description: Grab
              categoryId: c002
      responses:
        '200':
          description: SMS transaction saved
          content:
            application/json:
              example:
                success: true
                message: SMS transaction saved successfully
                data:
                  transactionId: t002
  /api/ai/categorize-transaction:
    post:
      tags: [AI]
      summary: Categorize transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizeTransactionRequest'
            example:
              description: Nap Lien Quan 50k
              amount: 50000
              type: Expense
      responses:
        '200':
          description: AI categorization result
          content:
            application/json:
              example:
                success: true
                data:
                  categoryId: c003
                  categoryName: Entertainment
                  confidence: 0.89
                  reason: The phrase 'Nap Lien Quan' indicates a game top-up.
  /api/ai/spending-score:
    post:
      tags: [AI]
      summary: Generate spending score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendingScoreRequest'
            example:
              fromDate: '2026-05-06'
              toDate: '2026-05-12'
      responses:
        '200':
          description: Spending score result
          content:
            application/json:
