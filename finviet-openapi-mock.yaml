  /api/budgets:
    get:
      tags: [Budgets]
      summary: Get budgets
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: Budget list
          content:
            application/json:
              example:
                success: true
                data:
                  - budgetId: bd001
