  /api/budgets/{budgetId}:
    put:
      tags: [Budgets]
      summary: Update budget
      parameters:
        - name: budgetId
          in: path
          required: true
          schema: { type: string, example: bd001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetRequest'
            example:
              limitAmount: 3500000
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              example:
                success: true
                message: Budget updated successfully
    delete:
      tags: [Budgets]
      summary: Delete budget
      parameters:
        - name: budgetId
          in: path
          required: true
          schema: { type: string, example: bd001 }
      responses:
        '200':
          description: Budget deleted
          content:
            application/json:
              example:
                success: true
                message: Budget deleted successfully
  /api/dashboard/summary:
